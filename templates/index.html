<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice App Runner UI</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        #api-response {
            margin-top: 20px;
            padding: 15px;
            background-color: #334155;
            border-radius: 6px;
            font-family: monospace;
            display: none; /* hidden until clicked */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello AWS App Runner! 🚀</h1>
        <p>This is a practice web app to test our CI/CD deployment pipeline.</p>
        
        <button onclick="testAPI()">Test REST API</button>
        
        <div id="api-response"></div>
    </div>

    <script>
        async function testAPI() {
            const responseDiv = document.getElementById('api-response');
            responseDiv.style.display = 'block';
            responseDiv.innerText = 'Fetching...';
            
            try {
                const response = await fetch('/api/chat');
                const data = await response.json();
                responseDiv.innerHTML = `<strong>${data.bot_name} says:</strong><br>${data.message}`;
                responseDiv.style.color = '#4ade80'; // Green text on success
            } catch (error) {
                responseDiv.innerText = 'Error connecting to API.';
                responseDiv.style.color = '#ef4444'; // Red text on error
            }
        }
    </script>
</body>
</html>
